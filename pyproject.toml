[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "sovereign-self-healing-mcp"
version = "2.0.0"
readme = "README.md"
description = "The only self-healing infrastructure MCP with cryptographic governance. Ed25519 sigil, BFT Council, 28-domain compliance."
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [{name = "CSOAI Labs", email = "nicholas@meok.ai"}]
dependencies = ["mcp>=2.0.0", "pynacl>=1.5.0"]
keywords = ["mcp", "ai", "sovereign", "self-healing", "infrastructure", "governance", "attestation", "bft", "compliance"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Monitoring",
    "Topic :: Security :: Cryptography",
]
[project.urls]
Homepage = "https://csoai.org"
Repository = "https://github.com/CSOAI-ORG/sovereign-self-healing-mcp"
[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["server.py", "auth_middleware.py", "sovereign_governance.py", "mcp2026_shim.py"]
[project.scripts]
sovereign_self_healing_mcp = "server:main"
